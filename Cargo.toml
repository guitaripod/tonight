[package]
name = "tonight"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "A self-hosted decision engine for your Steam library. Stop browsing. Start playing."
license = "GPL-3.0-only"
repository = "https://github.com/guitaripod/tonight"
default-run = "tonight"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "time", "sync", "process"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
rand = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
futures = "0.3"
dirs = "5"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
