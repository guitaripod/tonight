name: release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ''
          - os: macos-15-intel
            name: darwin-x86_64
            ext: ''
          - os: macos-latest
            name: darwin-aarch64
            ext: ''
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Stage assets
        shell: bash
        run: |
          mkdir -p staging
          cp "target/release/tonight${{ matrix.ext }}" "staging/tonight-${{ matrix.name }}${{ matrix.ext }}"
          cp install.sh install.ps1 staging/
      - uses: softprops/action-gh-release@v2
        with:
          files: staging/*