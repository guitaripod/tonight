services:
  tonight:
    build: .
    image: tonight:latest
    container_name: tonight
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - tonight-data:/data
      - ${STEAM_ROOT:-${HOME}/.steam/steam}:/steam:ro
    environment:
      TONIGHT_BIND: 0.0.0.0:7777

volumes:
  tonight-data:
